# Package Buddy Redux server - paste this into Portainer: Stacks > Add stack > Web editor.
#
# Portainer stack: build the image on the server first (see README, step 2).
# Fill in the values under "environment" (or use Portainer's
# "Environment variables" section, which fills the ${...} placeholders).

services:
  packagebuddy:
    image: packagebuddy-server:latest
    container_name: packagebuddy
    restart: unless-stopped
    ports:
      - "8765:8765"               # change the LEFT number if 8765 is already used on your server
    environment:
      TRACK17_API_KEY: ${TRACK17_API_KEY}           # your 17TRACK key (keep it secret)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}      # first admin, created on first start only
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}             # at least 8 characters
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-60}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}          # false = only the admin creates accounts
      AUTO_ARCHIVE_DAYS: ${AUTO_ARCHIVE_DAYS:-7}
      REQUIRE_APPROVAL: ${REQUIRE_APPROVAL:-false}  # true = admin approves every new number
      MONTHLY_NEW_NUMBERS_PER_USER: ${MONTHLY_NEW_NUMBERS_PER_USER:-0}  # 0 = no limit
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}  # true = never spend 17TRACK quota (safety switch)
      TZ: ${TZ:-America/Chicago}
    volumes:
      - packagebuddy-data:/data

volumes:
  packagebuddy-data:
