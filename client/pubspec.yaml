name: packagebuddy
description: "Package Buddy Redux client (self-hosted). Web, Android and Linux from one code base."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.13.7

dependencies:
  file_picker: ^13.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  http: ^1.6.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-300.ttf
          weight: 300
        - asset: assets/fonts/Roboto-400.ttf
          weight: 400
        - asset: assets/fonts/Roboto-500.ttf
          weight: 500
        - asset: assets/fonts/Roboto-700.ttf
          weight: 700
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-300.ttf
          weight: 300
        - asset: assets/fonts/RobotoCondensed-400.ttf
          weight: 400
        - asset: assets/fonts/RobotoCondensed-500.ttf
          weight: 500
        - asset: assets/fonts/RobotoCondensed-700.ttf
          weight: 700
