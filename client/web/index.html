<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Package Buddy Redux: your self-hosted package tracker">
  <meta name="theme-color" content="#13294b">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Package Buddy Redux">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Package Buddy Redux</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0f131a; }
    #pb-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; color: #64b5f6; font: 300 18px Roboto, system-ui, sans-serif; }
    #pb-loading img { width: 150px; height: 150px; object-fit: contain; }
  </style>
</head>
<body>
  <div id="pb-loading"><img src="assets/assets/icon/logo.png" alt=""><div>Loading Package Buddy Redux…</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('pb-loading'); if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
